name: Verify build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Smoke-test serverless APIs
        run: npx tsx scripts/verify-api.ts
      - name: Test GitHub settings saving and conflict handling
        run: npx tsx scripts/verify-save-menu.ts
      - name: Test product ratings and review moderation
        run: npx tsx scripts/verify-reviews.ts
      - name: Test mobile product navigation and cached deep links
        run: npx tsx scripts/verify-product-navigation.ts
      - name: Verify RTL mobile viewport and layout constraints
        run: npx tsx scripts/verify-responsive-layout.ts
