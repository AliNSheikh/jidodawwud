    <!-- Schema.org JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "L'Étoile Gastronomie",

      "priceRange": "$$$$",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "42 Rue de l'Amirauté",
        "addressLocality": "Paris",
        "postalCode": "75008",
        "addressCountry": "FR"
      },
      "telephone": "+33 1 42 68 55 00",
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
          "opens": "18:00",
          "closes": "23:30"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday", "Sunday"],
          "opens": "12:00",
          "closes": "15:00"
        }
      ],
      "hasMenu": {
        "@type": "Menu",
        "name": "Seasonal Haute Gastronomie Menu",
        "hasMenuSection": [
          {
            "@type": "MenuSection",

          },
          {
            "@type": "MenuSection",
            "name": "Chef's Specials & Mains",
            "description": "Dry-aged heritage meats, line-caught seafood, and black winter truffles"
          },
          {
            "@type": "MenuSection",
            "name": "Desserts & Mignardises",
            "description": "Grand cru chocolate entremets, blown sugar creations, and house churned sorbets"
          }
        ]
      }
    }
    </script>
